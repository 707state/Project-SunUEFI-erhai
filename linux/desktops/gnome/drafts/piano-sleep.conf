# Native PSCI memory suspend candidate. Desktop freeze/thaw is still under
# investigation; do not install this configuration in a release yet.
[Sleep]
AllowSuspend=yes
AllowHibernation=no
AllowHybridSleep=no
AllowSuspendThenHibernate=no
SuspendState=mem
MemorySleepMode=deep
