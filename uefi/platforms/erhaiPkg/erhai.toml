# NOT hardware validated. Stage-0 bring-up only.
# OnePlus Pad 2 Pro uses BOOT image header v4 with a raw AArch64 GKI Image,
# matching the piano wrapper assumptions; kernel compression and appended DTB
# still need confirmation against a real erhai boot.img before repacking.
[boot_shim]
requires_kernel_header = true
[uefi_fd]
base = 0xA7100000
size = 0x300000
[boot_image_kernel]
kernel_compression = "gzip"
append_dtb = true
[boot_image]
header_version = 4
